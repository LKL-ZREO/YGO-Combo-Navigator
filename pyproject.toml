[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ygo-combo-navigator"
version = "0.3.0"
description = "Manual screenshot combo navigator for Yu-Gi-Oh! Master Duel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PySide6>=6.7",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ygo-navigator = "app.main:main"
ygo-create-pack = "app.tools.create_deck_pack:main"
ygo-author-pack = "app.tools.author_deck_pack:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

